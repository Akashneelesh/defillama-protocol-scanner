name: Daily refresh

on:
  schedule:
    # 03:30 UTC every day
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      tvl_min:
        description: "Minimum TVL in USD"
        default: "300000"
      tvl_max:
        description: "Maximum TVL in USD"
        default: "5000000"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TVL_MIN: ${{ github.event.inputs.tvl_min || '300000' }}
          TVL_MAX: ${{ github.event.inputs.tvl_max || '5000000' }}
        run: bash scripts/run_pipeline.sh

      - name: Commit refreshed report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore(report): daily refresh $(date -u +%F)"
            git push
          fi
